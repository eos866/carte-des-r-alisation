<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Routes, universités, forages, centres de santé : chaque réalisation de l'État et des collectivités du Sénégal localisée, chiffrée et sourcée. Prototype CEGIT.">
<meta property="og:title" content="Carte des réalisations – Sénégal">
<meta property="og:description" content="Le Sénégal se transforme. Voici la preuve, territoire par territoire.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
<title>Carte des Réalisations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : bande d'en-tête | (panneau 380 px | carte + légende) | pied de page ; mobile : carte plein écran, liste et fiche en surimpression */
:root{
  --radius:10px;
  --background:oklch(0.966 0.008 135); --foreground:oklch(0.22 0.03 160);
  --card:oklch(0.995 0.003 135); --popover:oklch(0.995 0.003 135);
  --primary:oklch(0.45 0.09 162); --primary-fg:oklch(0.99 0 0);
  --muted:oklch(0.935 0.01 135); --muted-fg:oklch(0.45 0.025 160);
  --accent:oklch(0.92 0.03 160); --border:oklch(0.87 0.014 140); --ring:oklch(0.5 0.12 162);
  --destructive:oklch(0.52 0.19 27);
  --brand:oklch(0.31 0.055 165); --brand-fg:oklch(0.97 0.01 120);
  --gold:oklch(0.65 0.13 75); --gold-soft:oklch(0.8 0.12 80); --gold-ink:oklch(0.3 0.05 165);
  --st-livre:oklch(0.5 0.1 200); --st-cours:oklch(0.58 0.16 45); --st-prog:oklch(0.5 0.12 265);
  --real:oklch(0.45 0.09 162); --fake:oklch(0.5 0.02 250); --marker-ring:oklch(1 0 0);
  --sec-sante:oklch(0.55 0.18 25); --sec-educ:oklch(0.5 0.13 255); --sec-route:oklch(0.45 0.03 60); --sec-eau:oklch(0.58 0.12 220);
  --sec-energie:oklch(0.68 0.15 85); --sec-agri:oklch(0.55 0.13 135); --sec-mob:oklch(0.48 0.12 290); --sec-marche:oklch(0.6 0.14 50);
  --sec-sport:oklch(0.55 0.15 340); --sec-culture:oklch(0.5 0.1 15); --sec-env:oklch(0.52 0.1 165);
  --shadow-float:0 8px 28px -10px oklch(0.2 0.04 160 / 0.35);
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
}
:root.dark{
  --background:oklch(0.19 0.02 165); --foreground:oklch(0.94 0.01 130);
  --card:oklch(0.23 0.025 165); --popover:oklch(0.24 0.025 165);
  --primary:oklch(0.7 0.13 160); --primary-fg:oklch(0.17 0.03 165);
  --muted:oklch(0.27 0.02 165); --muted-fg:oklch(0.74 0.02 140);
  --accent:oklch(0.3 0.04 162); --border:oklch(0.34 0.025 165); --ring:oklch(0.72 0.13 160);
  --destructive:oklch(0.7 0.16 27);
  --brand:oklch(0.15 0.03 165); --gold:oklch(0.78 0.13 80);
  --st-livre:oklch(0.72 0.11 200); --st-cours:oklch(0.74 0.15 50); --st-prog:oklch(0.72 0.12 265);
  --real:oklch(0.72 0.13 160); --fake:oklch(0.72 0.02 250); --marker-ring:oklch(0.98 0 0);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.5 var(--f-sans)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-0.01em;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-fg)}
.muted{color:var(--muted-fg)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icobtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-float);display:inline-flex;align-items:center;justify-content:center;color:var(--foreground)}
.icobtn:hover{background:var(--muted)}
.ghost{width:40px;height:40px;border-radius:9px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.ghost:hover{background:var(--muted)}
.ghost:disabled{opacity:.4;cursor:default}
.btn{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:8px 12px;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--muted)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{filter:brightness(1.05);background:var(--gold)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;padding:4px 6px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:3000;background:var(--brand)}

/* ---------- En-tête ---------- */
.hdr{background:var(--brand);color:var(--brand-fg)}
.hdr .in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:40px;padding-block:18px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.hero{flex:1;min-width:0}
.eyebrow{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
.hero h1{margin-top:4px;font-size:clamp(1.45rem,2vw,1.75rem);font-weight:700;line-height:1.08;text-wrap:balance}
.hero h1 span{color:var(--gold)}
.hero p{margin-top:8px;max-width:48rem;font-size:.9rem;line-height:1.55;opacity:.86}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 20px;margin:0;width:520px;flex:none}
.keys div{border-left:2px solid var(--gold);padding-left:12px}
.keys dd{margin:0;font:600 1.5rem/1 var(--f-mono)}
.keys dt{margin-top:4px;font-size:.75rem;line-height:1.3;opacity:.82}
.mhdr{display:none;background:var(--brand);color:var(--brand-fg);align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mhdr .t{flex:1;min-width:0}
.mhdr b{display:block;font:700 1rem/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhdr small{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}
.mhdr .ghost:hover{background:color-mix(in oklab,var(--brand-fg) 12%,transparent)}

/* ---------- Application ---------- */
.app{display:grid;grid-template-columns:380px minmax(0,1fr);height:calc(100dvh - 2rem);min-height:620px}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--border);background:var(--background)}
.side .top{padding:16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:0 12px;color:var(--muted-fg)}
.search.float{height:48px;box-shadow:var(--shadow-float)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--foreground);font-size:1rem}
.search input::placeholder{color:var(--muted-fg)}
.search:focus-within{outline:3px solid var(--ring);outline-offset:1px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:4px}
.seg{display:flex;gap:4px;border-radius:9px;background:var(--muted);padding:4px}
.seg button{flex:1;border:0;border-radius:7px;background:none;padding:6px 8px;font-size:.88rem;font-weight:600;color:var(--muted-fg)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px oklch(0 0 0 / .12)}
.stchips{display:flex;gap:6px}
.stchip{flex:1;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:6px 6px;font-size:.86rem;font-weight:600;color:var(--muted-fg);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.stchip[aria-pressed="true"]{color:var(--c);border-color:var(--c);background:color-mix(in oklab,var(--c) 16%,var(--card))}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--c);background:var(--c)}
.sdot.wip{border-style:dashed}
.sdot.plan{background:transparent}
select.sel{height:40px;width:100%;border:1px solid var(--border);border-radius:9px;background:var(--card);padding:0 10px;font-size:.9rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-family:var(--f-mono);font-size:.72rem;border-radius:999px;background:var(--primary);color:var(--primary-fg);padding:0 6px}
.summ{display:flex;align-items:center;justify-content:space-between;font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 12px;align-items:center}
.tab{border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;font-size:.9rem;font-weight:600;color:var(--muted-fg)}
.tab[aria-selected="true"]{border-color:var(--gold);color:var(--foreground)}
.tabs .sp{flex:1}
.csv{border:0;background:none;color:var(--primary);font-weight:600;font-size:.88rem;padding:6px 8px;border-radius:7px;display:inline-flex;gap:6px;align-items:center}
.csv:hover{background:var(--muted)}
.res{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.plist{list-style:none;margin:0;padding:0}
.plist li+li{border-top:1px solid var(--border)}
.pitem{display:flex;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 16px}
.pitem:hover,.pitem:focus-visible,.pitem[aria-current="true"]{background:var(--muted)}
.pitem[aria-current="true"]{background:var(--accent)}
.pitem .b{min-width:0;flex:1}
.pitem strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.3}
.pitem .w{display:block;margin-top:2px;font-size:.88rem;color:var(--muted-fg)}
.pitem .meta{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pitem .amt{font-size:.75rem;font-weight:500}
.empty{padding:24px;text-align:center;color:var(--muted-fg)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid color-mix(in oklab,var(--c) 45%,transparent);background:color-mix(in oklab,var(--c) 10%,transparent);color:var(--c);font-weight:600;font-size:.75rem;padding:1px 8px}
.badge.big{font-size:.88rem;padding:4px 12px}
.badge .sdot{width:8px;height:8px}
.src{display:inline-flex;align-items:center;gap:4px;border-radius:5px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px}
.src.real{color:var(--real);background:color-mix(in oklab,var(--real) 12%,transparent)}
.src.fake{color:var(--fake);border:1px dashed color-mix(in oklab,var(--fake) 60%,transparent)}
.mk{display:inline-flex;flex:none}
.mk svg{display:block}

/* Synthèse */
.syn{padding:16px;display:flex;flex-direction:column;gap:24px}
.syn .big{font:600 1.5rem var(--f-mono);margin-top:4px}
.syn .big small{font-size:1rem;color:var(--muted-fg)}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.stgrid div{border:1px solid var(--border);background:var(--card);border-radius:9px;padding:8px}
.stgrid dt{font-size:.75rem;font-weight:600;color:var(--c)}
.stgrid dd{margin:0;font:600 1.25rem var(--f-mono)}
.secl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.secb{width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:7px}
.secb:hover{background:var(--muted)}
.secb[aria-pressed="true"]{background:var(--accent)}
.secb .l{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.secb .t{display:block;margin-top:4px;height:6px;border-radius:4px;background:var(--muted)}
.secb .t i{display:block;height:100%;border-radius:4px}
.years{display:flex;align-items:flex-end;gap:6px;height:128px;margin-top:8px}
.yb{flex:1;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0}
.yb i{display:block;width:100%;border-radius:5px 5px 0 0;background:color-mix(in oklab,var(--primary) 70%,transparent)}
.yb:hover i{background:var(--primary)}
.yb[aria-pressed="true"] i{background:var(--gold)}
.yb span{font-size:.75rem}
.yb small{font-size:.68rem;color:var(--muted-fg)}

/* ---------- Carte ---------- */
.mapcol{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.mapbox{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--muted)}
.mtop{position:absolute;left:12px;right:12px;top:12px;z-index:1000;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.mtop > *{pointer-events:auto}
.mtop .msearch{display:none;flex:1;min-width:0;gap:8px}
.mtop .sp{flex:1;pointer-events:none}
.mtop .col{display:flex;flex-direction:column;gap:8px}
.fdot{position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.pop{position:absolute;right:56px;top:0;z-index:1200;width:288px;border:1px solid var(--border);border-radius:12px;background:var(--popover);box-shadow:var(--shadow-float);padding:12px}
.pop .seg{margin:6px 0 12px}
.pop .seg button{font-size:.76rem}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.bopt{border:0;background:none;border-radius:9px;padding:4px;font-size:.7rem;font-weight:500;line-height:1.2;text-align:center}
.bopt:hover{background:var(--muted)}
.bopt[aria-checked="true"]{box-shadow:0 0 0 2px var(--primary)}
.bopt .th{display:block;aspect-ratio:1;border-radius:7px;border:1px solid var(--border);margin-bottom:4px;overflow:hidden;background-size:cover}
.bopt .th img{width:100%;height:100%;object-fit:cover;display:block}
.bnote{margin-top:10px;font-size:.76rem;border-radius:7px;padding:6px 8px;background:color-mix(in oklab,var(--gold) 18%,transparent)}
.clist{position:absolute;left:12px;top:12px;z-index:1050;width:min(360px,calc(100% - 24px));border:1px solid var(--border);border-radius:12px;background:var(--popover);box-shadow:var(--shadow-float);outline:none}
.clist .h{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 4px 4px 16px;font-size:.9rem;font-weight:600}
.clist ul{list-style:none;margin:0;padding:4px 0;max-height:256px;overflow-y:auto}
.clist button.it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 12px;text-align:left;font-size:.9rem}
.clist button.it:hover{background:var(--muted)}
.clist .it b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clist .it small{color:var(--muted-fg);font-size:.76rem}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;z-index:900;text-align:center;padding:24px;color:var(--muted-fg)}
.listpill{display:none;position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:1000;border:0;border-radius:999px;background:var(--brand);color:var(--brand-fg);padding:12px 20px;font-weight:600;box-shadow:var(--shadow-float);align-items:center;gap:8px}
.legend{border-top:1px solid var(--border);background:var(--card);padding:8px 16px}
.legend summary{cursor:pointer;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-fg)}
.legrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:.76rem;padding:8px 0 4px}
.legrow > span{display:inline-flex;align-items:center;gap:6px}
.legrow .vs{width:1px;height:16px;background:var(--border)}
.legrow .d{width:10px;height:10px;border-radius:50%}
.choroleg{display:flex;align-items:center;gap:8px;font-size:.76rem;padding:8px 0 4px}
.choroleg i{width:140px;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in oklab,var(--gold) 12%,transparent),var(--gold))}

/* Fiche projet */
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:440px;z-index:1100;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:var(--shadow-float);overflow:hidden}
.panel.presenting{width:min(640px,46vw);font-size:1.15rem}
.grip{display:none;width:100%;border:0;background:none;padding:8px 0 4px;justify-content:center;touch-action:none}
.grip span{width:48px;height:6px;border-radius:3px;background:var(--border)}
.pbar{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border);padding:6px 8px}
.pbar .sp{flex:1}
.pbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.ph{position:relative;aspect-ratio:16/7;display:flex;align-items:center;justify-content:center;color:var(--brand-fg);margin:0;overflow:hidden;
  background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--sec) 10%,transparent) 0 2px,transparent 2px 14px),linear-gradient(160deg,color-mix(in oklab,var(--sec) 28%,var(--card)),color-mix(in oklab,var(--brand) 85%,var(--sec)))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph figcaption{position:absolute;left:12px;bottom:8px;border-radius:5px;background:color-mix(in oklab,var(--brand) 72%,transparent);color:var(--brand-fg);padding:2px 8px;font-size:.75rem;font-weight:500;max-width:calc(100% - 24px)}
.ph .src{position:absolute;top:8px;left:12px;background:var(--card)}
.ph .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:oklch(0 0 0 / .45);color:#fff}
.ph .nav.l{left:8px}.ph .nav.r{right:8px}
.ph .cnt{position:absolute;top:8px;right:12px;border-radius:5px;background:oklch(0 0 0 / .5);color:#fff;font-size:.72rem;padding:1px 6px}
.sec1{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.secname{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--sc)}
.panel h2{font-size:1.25rem;font-weight:700;line-height:1.2;outline:none;text-wrap:balance}
.panel.presenting h2{font-size:1.9rem}
.late{border-radius:999px;background:color-mix(in oklab,var(--destructive) 12%,transparent);color:var(--destructive);font-size:.75rem;font-weight:600;padding:4px 10px}
.amtbox{border-radius:12px;background:var(--muted);padding:12px}
.amtbox .v{font:600 1.5rem var(--f-mono)}
.amtbox .v small{font-size:1rem;color:var(--muted-fg)}
.panel.presenting .amtbox .v{font-size:1.9rem}
.amtbox .f{font-size:.75rem;color:var(--muted-fg)}
.amtbox .ml{margin-top:2px;font-size:.88rem;color:var(--muted-fg)}
.loc{font-size:.9rem}
.sec2{border-top:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:24px}
.sec2 > p{line-height:1.6}
.sec3{border-top:1px solid var(--border);background:color-mix(in oklab,var(--muted) 45%,transparent);padding:20px;display:flex;flex-direction:column;gap:24px}
.h{margin-bottom:8px}
.indg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.indg div{border:1px solid var(--border);border-radius:9px;padding:8px}
.indg dd{margin:0;font:600 1.05rem/1.2 var(--f-mono)}
.indg dt{font-size:.75rem;color:var(--muted-fg)}
.barw .l{display:flex;justify-content:space-between;font-size:.9rem}
.barw .t{margin-top:4px;height:8px;border-radius:4px;background:var(--muted)}
.barw .t i{display:block;height:100%;border-radius:4px;background:var(--primary)}

const MAXM = Math.max(...PROJETS.map(p=>p.m||0));
const markerSize = p => p.m==null ? 28 : Math.round(28 + 20*Math.sqrt(p.m/MAXM));
function markerSvg(p, size=markerSize(p)){
  const c=size/2, r=c-2.5, col=secColor(p.s), hollow=p.st==="Programmé";
  const circle = hollow
    ? `<circle cx="${c}" cy="${c}" r="${r}" style="fill:var(--card);stroke:${col}" stroke-width="3.5"/>`
    : `<circle cx="${c}" cy="${c}" r="${r}" style="fill:${col};stroke:var(--marker-ring)" stroke-width="2.5"${p.st==="En cours"?' stroke-dasharray="4 3"':""}/>`;
  const is=size*0.52, k=is/24, o=c-is/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${circle}<g transform="translate(${o} ${o}) scale(${k})" fill="none" style="stroke:${hollow?col:"#fff"}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${PICTOS[p.ic]||""}"/></g></svg>`;
}

const VIDE = () => ({q:"", nv:"", st:[...STATUTS], r:"", src:"", s:[], late:false, clim:false, gen:false, axe:"", yr:""});
let F = VIDE();
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function filtrer(f){
  const q = norm(f.q.trim());
  return PROJETS.filter(p =>
    (!f.nv || p.nv===f.nv) && f.st.includes(p.st) && (!f.r || p.r===f.r) && (!f.src || p.src===f.src) &&
    (!f.s.length || f.s.includes(p.s)) && (!f.late || p.late) && (!f.clim || p.clim) && (!f.gen || p.gen) &&
    (!f.axe || p.axe===f.axe) && (!f.yr || p.yr===f.yr) &&
    (!q || norm([p.t,p.c,p.d,REGIONS[p.r],p.mo,SECTEURS[p.s]].join(" ")).includes(q))
  ).sort((a,b)=>(b.m||0)-(a.m||0));
}
const countMore = f => f.s.length + (f.src?1:0) + (f.late?1:0) + (f.clim?1:0) + (f.gen?1:0) + (f.axe?1:0) + (f.yr?1:0);
const isDefault = f => JSON.stringify({...f,q:""})===JSON.stringify({...VIDE(),q:""}) && !f.q;
const ordreVisite = L => [...L.filter(p=>p.st==="Livré"), ...L.filter(p=>p.st!=="Livré")];
function km(a,b){ const R=6371,r=Math.PI/180,dl=(b.y-a.y)*r,dg=(b.x-a.x)*r,x=Math.sin(dl/2)**2+Math.cos(a.y*r)*Math.cos(b.y*r)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const proches = p => PROJETS.filter(o=>o.id!==p.id).map(o=>({p:o,d:km(p,o)})).sort((a,b)=>a.d-b.d).slice(0,3);

/* ---------- Carte (Leaflet + regroupement) ---------- */
const SN_BOUNDS = [[12.25,-17.6],[16.7,-11.3]];
function labelPoint(g){
  const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
  let best=polys[0][0], bestA=0;
  for(const p of polys){ const ring=p[0]; let a=0; for(let i=0;i<ring.length-1;i++) a+=ring[i][0]*ring[i+1][1]-ring[i+1][0]*ring[i][1]; if(Math.abs(a)>bestA){bestA=Math.abs(a);best=ring;} }
  let A=0,cx=0,cy=0; for(let i=0;i<best.length-1;i++){ const [x0,y0]=best[i],[x1,y1]=best[i+1],f=x0*y1-x1*y0; A+=f; cx+=(x0+x1)*f; cy+=(y0+y1)*f; }
  return [cy/(3*A), cx/(3*A)];
}
const MAP = {
  map:null, cluster:null, base:[], regions:null, labels:null, markers:new Map(), ok:0, err:0,
  init(){
    const msg = document.getElementById("mapmsg");
    if(!window.L || !L.markerClusterGroup){ msg.innerHTML = "La carte n'a pas pu se charger.<br>Vérifiez votre connexion puis rechargez la page."; return; }
    const map = this.map = L.map("map", {zoomControl:false, minZoom:6, maxZoom:18, zoomSnap:0.25, keyboard:true, attributionControl:true});
    map.fitBounds(SN_BOUNDS, {animate:false});
    L.control.zoom({position:"bottomright", zoomInTitle:"Zoomer", zoomOutTitle:"Dézoomer"}).addTo(map);
    map.attributionControl.setPrefix(false);
    map.createPane("regions").style.zIndex = 350;
    map.createPane("labels").style.zIndex = 360;
    const cl = this.cluster = L.markerClusterGroup({showCoverageOnHover:false, zoomToBoundsOnClick:false, maxClusterRadius:48, spiderfyOnMaxZoom:true,
      iconCreateFunction:c=>{ const n=c.getChildCount(), s=n<5?38:n<10?44:52; return L.divIcon({className:"pcl", html:`<div aria-hidden="true">${n}</div>`, iconSize:[s,s]}); }});
    cl.on("clusterclick", e=>{
      const c = e.layer; S.cluster = c.getAllChildMarkers().map(m=>m.options.pid); renderCluster();
      if(map.getZoom()>=15) c.spiderfy(); else c.zoomToBounds({padding:[60,60]});
    });
    const lab = ()=>document.querySelectorAll("#map .pcl").forEach(n=>{ n.setAttribute("role","button"); n.setAttribute("aria-label",`Groupe de ${n.textContent} projets. Entrée pour afficher la liste.`); });
    cl.on("animationend", lab); map.on("zoomend moveend", lab);
    map.addLayer(cl);
    new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById("map"));
    msg.hidden = true;
    this.setBase(S.base);
    this.update();
  },
  setBase(id){
    const map=this.map; if(!map) return;
    this.base.forEach(l=>map.removeLayer(l));
    const b = BASES.find(x=>x.id===id) || BASES[0];
    this.base = b.layers.map((u,i)=>L.tileLayer(u,{attribution:i?"":b.attr, maxZoom:19, maxNativeZoom:id==="relief"?18:19, crossOrigin:false}));
    this.base.forEach(l=>{ l.on("tileload",()=>{this.ok++;}); l.on("tileerror",()=>{ this.err++; if(!tilesBlocked && this.ok===0 && this.err>=4){ tilesBlocked=true; chooseBase("none",true); toast("Fonds de plan indisponibles dans cet aperçu : ils s'affichent sur la version en ligne."); } }); l.addTo(map); });
    this.drawRegions();
  },
  drawRegions(){
    const map=this.map; if(!map) return;
    this.regions?.remove(); this.labels?.remove();
    const b = BASES.find(x=>x.id===S.base) || BASES[0];
    const choro = S.mode==="choro";
    const sums = new Map(); S.list.forEach(p=>sums.set(p.r,(sums.get(p.r)||0)+(p.m||0)));
    const max = Math.max(1,...sums.values());
    const css = getComputedStyle(document.documentElement);
    const gold = css.getPropertyValue("--gold").trim()||"#c08a1e", brand = css.getPropertyValue("--brand").trim()||"#0d3b2c";
    const lineCol = b.light ? brand : "#ffffff";
    this.regions = L.geoJSON(GEO, {pane:"regions",
      style:f=>{ const v=sums.get(f.properties.n)||0; return {color:lineCol, weight:(F.r===f.properties.n)?3:(b.light?1.2:1.6), opacity:b.light?.6:.9, fillColor:gold, fillOpacity: choro ? (v?0.12+0.68*Math.sqrt(v/max):0.03) : (F.r && F.r!==f.properties.n ? .25 : 0), fillColor: choro?gold:"#000", interactive:true}; },
      onEachFeature:(f,layer)=>{
        layer.on("click",()=>setF({r: F.r===f.properties.n ? "" : f.properties.n}));
        layer.bindTooltip(choro ? `${REGIONS[f.properties.n]} : ${fmtShort(sums.get(f.properties.n)||0)} FCFA` : `Région de ${REGIONS[f.properties.n]}`, {sticky:true});
      }}).addTo(map);
    this.labels = L.layerGroup(GEO.features.map(f=>{
      const v=sums.get(f.properties.n)||0;
      return L.marker(labelPoint(f.geometry), {pane:"labels", interactive:false, keyboard:false,
        icon:L.divIcon({className:`rlabel${b.light?" on-light":""}`, html:`${esc(REGIONS[f.properties.n])}${choro?`<span class="v">${v?fmtShort(v):"—"}</span>`:""}`, iconSize:null})});
    })).addTo(map);
  },
  update(){
    const map=this.map, cl=this.cluster; if(!map) return;
    cl.clearLayers(); this.markers.clear();
    if(S.mode==="points"){
      cl.addLayers(S.list.map(p=>{
        const s=markerSize(p);
        const m=L.marker([p.y,p.x],{icon:L.divIcon({className:`pmk${p.id===S.sel?" is-sel":""}`, html:markerSvg(p,s), iconSize:[s,s]}), title:`${p.t} — ${STATUT_LABEL[p.st]}, ${SECTEURS[p.s]}, ${p.c}`, alt:p.t, riseOnHover:true, pid:p.id});
        m.on("click",()=>select(p.id));
        this.markers.set(p.id,m); return m;
      }));
    }
    this.drawRegions();
  },
  highlight(){
    const map=this.map, cl=this.cluster; if(!map) return;
    this.markers.forEach((m,id)=>m.getElement()?.classList.toggle("is-sel", id===S.sel));
    if(S.sel==null) return;
    const m=this.markers.get(S.sel); if(!m) return;
    const go=()=>{ m.getElement()?.classList.add("is-sel"); map.panInside(m.getLatLng(),{paddingTopLeft:[40,80], paddingBottomRight:isWide()?[480,40]:[40,window.innerHeight*0.55], animate:!RM()}); };
    if(map.getZoom()<9 && !cl.getVisibleParent(m)?.getElement()) map.setView(m.getLatLng(),9,{animate:!RM()});
    cl.zoomToShowLayer(m, go);
  },
  home(){ this.map?.flyToBounds(SN_BOUNDS,{animate:!RM(), duration:.8}); }
};

    <div class="pbar">
      <button type="button" class="ghost" data-a="prev" aria-label="Projet précédent">${ico("left",20)}</button>
      <span class="num muted" style="font-size:.88rem" aria-live="polite">${idx+1} / ${nav.length}</span>
      <button type="button" class="ghost" data-a="next" aria-label="Projet suivant">${ico("right",20)}</button>
      <span class="sp"></span>
      <button type="button" class="btn" style="border:0;background:none" data-a="copy">${ico("link")}<span>Copier le lien</span></button>
      <button type="button" class="ghost" data-a="close" aria-label="Fermer la fiche (Échap)">${ico("x",20)}</button>
    </div>
    <div class="pbody" id="pbody">
      ${photoHTML(p)}
      <div class="sec1">
        <p class="secname" style="--sc:${secColor(p.s)}">${mk(p,22)}${esc(SECTEURS[p.s])}</p>
        <h2 id="pp-title" tabindex="-1">${esc(p.t)}</h2>
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">${statusBadge(p.st,true)}${p.late?`<span class="late">Échéance dépassée</span>`:""}</div>
        <div class="amtbox"><p class="v num" title="${esc(fmtFull(p.m))}">${p.m==null?"Non communiqué":`${fmtShort(p.m)} <small>FCFA</small>`}</p>${p.m!=null?`<p class="f num">${fmtFull(p.m)}</p>`:""}${p.ml?`<p class="ml">${esc(p.ml)}</p>`:""}</div>
        <p class="loc"><b>${esc(p.c)}</b> · ${esc(p.d)} · Région de ${esc(REGIONS[p.r])}<br><span class="muted">${esc(p.mo)} (${p.nv==="État"?"État":"Collectivité territoriale"})</span></p>
      </div>
      <div class="sec2">
        <p>${esc(p.desc)}</p>
        ${p.ind&&p.ind.length?`<section><h3 class="cap h">Indicateurs</h3><dl class="indg">${p.ind.map(([v,l])=>`<div><dd>${esc(v)}</dd><dt>${esc(l)}</dt></div>`).join("")}</dl></section>`:""}
        <section style="display:flex;flex-direction:column;gap:12px"><h3 class="cap">Avancement</h3>${barHTML("Avancement physique",p.av?p.av[0]:null)}${barHTML("Crédits décaissés",p.av?p.av[1]:null)}</section>
        <section class="two"><div><h3 class="cap h">Financement</h3><p>${esc(p.fin)}</p></div><div><h3 class="cap h">Calendrier</h3><p>Début : <span class="num">${fmtMonth(p.deb)}</span><br>Fin : <span class="num">${fmtMonth(p.end)}</span></p></div></section>
        <section><h3 class="cap h">Orientation</h3><div class="tags">${p.axe?`<span class="g">Sénégal 2050 · ${esc(AXES[p.axe])}</span>`:""}${p.clim?`<span>Adaptation au climat</span>`:""}${p.gen?`<span>Égalité femmes-hommes</span>`:""}</div></section>
      </div>
      <div class="sec3">
        <section><h3 class="cap h">Source officielle</h3>${p.ref&&p.ref.length?`<ul class="srcl">${p.ref.filter(k=>SOURCES[k]).map(k=>`<li><a href="${esc(SOURCES[k].u)}" target="_blank" rel="noopener">${esc(SOURCES[k].n)} ${ico("ext",14)}</a></li>`).join("")}</ul>`:`<p class="muted" style="font-size:.9rem">Exemple fictif : aucune source officielle.</p>`}</section>
        <section><h3 class="cap h">Vue immersive</h3><div class="ext">${[["Street View",`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}`],["Google Maps",`https://www.google.com/maps/search/?api=1&query=${ll}`],["Mapillary",`https://www.mapillary.com/app/?lat=${p.y}&lng=${p.x}&z=16`]].map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${l}${ico("ext",14)}</a>`).join("")}</div></section>
        ${upl}
        <section><h3 class="cap h">À proximité</h3><ul class="near">${near.map(({p:o,d})=>`<li><button type="button" data-a="sel" data-v="${o.id}">${mk(o,28)}<span class="n">${esc(o.t)}</span><span class="d num">${d<1?Math.round(d*1000)+" m":d.toLocaleString("fr-FR",{maximumFractionDigits:d<10?1:0})+" km"}</span></button></li>`).join("")}</ul></section>
        <section><h3 class="cap h">Et sur le terrain ?</h3>
          <p class="muted" style="font-size:.88rem;margin-bottom:8px">${canVote?"Signalez l'état réel de l'ouvrage. Touchez à nouveau votre choix pour le retirer.":`<span class="soon">Bientôt disponible</span>Signalez l'état réel de l'ouvrage.`}</p>
          <div class="votes">${[["ok","En service"],["pb","Problème constaté"],["nv","Pas encore visible"]].map(([k,l])=>`<button type="button" data-a="vote" data-v="${k}" aria-pressed="${mine===k}" ${canVote?"":"disabled"}><span>${l}</span>${canVote?`<span class="num">${c[k]}</span>`:""}</button>`).join("")}</div>
        </section>
      </div>
    </div>`;
  panel.hidden=false; document.getElementById("listpill").hidden=true;
  document.getElementById("pbody").scrollTop=0;
  if(!pres) document.getElementById("pp-title").focus({preventScroll:true});
  const f=document.getElementById("ufile"); if(f) f.onchange=()=>uploadPhotos(p,[...f.files]);
}

/* ---------- Lien partageable ---------- */
function writeHash(){ try{ history.replaceState(null,"", S.sel ? "#projet-"+S.sel : location.pathname+location.search); }catch(e){} }
function readLink(){
  const h=/^#projet-(\d+)$/.exec(location.hash); const q=new URLSearchParams(location.search).get("projet");
  const id = h ? +h[1] : (q ? +q : null);
  if(id && PROJETS.some(p=>p.id===id)) select(id);
}

/* ---------- Visite guidée ---------- */
const TOUR_MS=8000; let tourTimer=null;
function startTour(){
  const ids = ordreVisite(S.list.length?S.list:PROJETS).map(p=>p.id);
  if(S.mode!=="points"){ S.mode="points"; renderLegend(); renderLayersPop(); MAP.update(); }
  S.tour={ids,i:0,t:0,paused:false}; S.cluster=null; renderCluster();
  document.body.classList.add("touring");
  try{ document.documentElement.requestFullscreen?.().catch(()=>{}); }catch(e){}
  setTimeout(()=>MAP.map?.invalidateSize(),60);
  select(ids[0]); renderTour();
  clearInterval(tourTimer);
  tourTimer=setInterval(()=>{ if(!S.tour||S.tour.paused) return; S.tour.t+=100; if(S.tour.t>=TOUR_MS){ S.tour.i=(S.tour.i+1)%S.tour.ids.length; S.tour.t=0; select(S.tour.ids[S.tour.i]); } renderTourProgress(); },100);
}
function stopTour(){ if(!S.tour) return; clearInterval(tourTimer); S.tour=null; document.body.classList.remove("touring"); document.getElementById("tourbar").hidden=true; try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){} setTimeout(()=>MAP.map?.invalidateSize(),60); if(S.sel) renderPanel(); }
function renderTour(){
  const el=document.getElementById("tourbar"); const t=S.tour;
  el.innerHTML=`<div class="pg"><i id="tourpg"></i></div><div class="r"><span class="eyebrow" style="font-size:.72rem">Visite guidée</span><span class="num" style="font-size:.88rem;opacity:.85">${t.i+1} / ${t.ids.length}</span><span style="flex:1"></span>
    <button type="button" class="ghost" data-a="prev" aria-label="Fiche précédente">${ico("left",20)}</button>
    <button type="button" class="ghost" data-a="tpause" aria-label="${t.paused?"Reprendre":"Pause"}">${ico(t.paused?"play":"pause")}</button>
    <button type="button" class="ghost" data-a="next" aria-label="Fiche suivante">${ico("right",20)}</button>
    <button type="button" class="stop" data-a="tstop">${ico("stop",16)}Arrêter</button></div>`;
  el.hidden=false; renderTourProgress();
}
function renderTourProgress(){ const i=document.getElementById("tourpg"); if(i&&S.tour){ i.style.width=(S.tour.t/TOUR_MS*100)+"%"; const n=document.querySelector("#tourbar .num"); if(n) n.textContent=`${S.tour.i+1} / ${S.tour.ids.length}`; } }

/* ---------- Thème ---------- */
function applyTheme(){ document.documentElement.classList.toggle("dark",S.dark); document.querySelectorAll("[data-themeicon]").forEach(b=>{ b.innerHTML=ico(S.dark?"sun":"moon"); b.setAttribute("aria-label",S.dark?"Thème clair":"Thème sombre"); }); if(MAP.map){ MAP.update(); if(S.sel) MAP.highlight(); } }
function chooseBase(id, silent){ S.base=id; try{ if(!silent) localStorage.setItem("carte-fond",id); }catch(e){} MAP.setBase(id); renderLayersPop(); }

/* ---------- Export CSV ---------- */
function toCSV(L){
  const cols=["id","titre","provenance","secteur","avancement","porteur","niveau","region","departement","commune","latitude","longitude","montant_fcfa","precision_montant","financement","debut","fin","orientation_senegal_2050","sources"];
  const q=v=>{ const s=v==null?"":String(v); return /[";\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  return "﻿"+cols.join(";")+"\n"+L.map(p=>[p.id,p.t,p.src==="real"?"reel":"exemple",SECTEURS[p.s],STATUT_LABEL[p.st],p.mo,p.nv,REGIONS[p.r],p.d,p.c,p.y,p.x,p.m??"",p.ml,p.fin,p.deb||"",p.end||"",AXES[p.axe]||"",(p.ref||[]).map(k=>SOURCES[k]?.u).filter(Boolean).join(" | ")].map(q).join(";")).join("\n");
}
async function exportCSV(){
  const data=toCSV(S.list), name=`realisations-senegal-${new Date().toISOString().slice(0,10)}.csv`;
  if(CAP.dl){ try{ await CAP.dl.save({filename:name,data}); }catch(e){ if(e&&e.code!=="cancelled") toast("L'export n'a pas abouti."); } return; }
  const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"})),download:name});
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- Divers ---------- */
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
async function copyLink(){
  const url = location.href.split("#")[0].split("?")[0]+"#projet-"+S.sel;
  try{ await navigator.clipboard.writeText(url); toast("Lien copié dans le presse-papiers"); }catch(e){ toast("Copie impossible : "+url); }
}
function openAbout(){
  const d=document.getElementById("dabout");
  d.innerHTML=`<div style="display:flex;justify-content:flex-end;padding:8px"><button type="button" class="ghost" data-a="about-close" aria-label="Fermer">${ico("x",20)}</button></div>
  <div class="in"><div class="hero">${heroHTML}</div><dl class="keys">${keysHTML}</dl><div><button type="button" class="btn gold" data-a="about-tour">${ico("play")}Lancer la visite guidée</button></div></div>
  <div class="foot" style="display:block"><div class="in" style="grid-template-columns:1fr">${footHTML}</div></div>`;
  d.showModal();
}

/* ---------- Événements (délégation) ---------- */
document.addEventListener("click", e=>{
  const pop=document.getElementById("layersPop");
  if(!pop.hidden && !e.target.closest("#layersPop") && !e.target.closest("#layersBtn")){ pop.hidden=true; document.getElementById("layersBtn").setAttribute("aria-expanded","false"); }
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  switch(a){
    case "nv": setF({nv:v}); break;
    case "st": { const on=F.st.includes(v); const st=on?F.st.filter(x=>x!==v):[...F.st,v]; setF({st:st.length?st:[v]}); break; }
    case "src": setF({src:v}); break;
    case "sec": setF({s:F.s.includes(v)?F.s.filter(x=>x!==v):[...F.s,v]}); break;
    case "flag": setF({[v]:!F[v]}); break;
    case "yr": setF({yr:F.yr===v?"":v}); break;
    case "reset": F=VIDE(); renderAll(); break;
    case "more": openMore(false); break;
    case "mfilters": openMore(true); break;
    case "more-close": document.getElementById("dmore").close(); break;
    case "more-reset": setF(moreMain?{...VIDE(),q:F.q}:{s:[],src:"",late:false,clim:false,gen:false,axe:"",yr:""}); break;
    case "tab": S.tab=v; renderAll(); break;
    case "csv": exportCSV(); break;
    case "sel": select(+v); break;
    case "close": S.tour?stopTour():closePanel(); break;
    case "prev": step(-1); break;
    case "next": step(1); break;
    case "copy": copyLink(); break;
    case "grip": S.full=!S.full; panel.classList.toggle("full",S.full); el.setAttribute("aria-expanded",S.full); break;
    case "photo": { const n=photosOf(PROJETS.find(p=>p.id===S.sel)).length; S.photo=(S.photo+(+v)+n)%n; renderPanel(); break; }
    case "vote": castVote(S.sel, v); break;
    case "cl-close": S.cluster=null; renderCluster(); break;
    case "layers": { pop.hidden=!pop.hidden; el.setAttribute("aria-expanded",!pop.hidden); if(!pop.hidden) renderLayersPop(); break; }
    case "mode": S.mode=v; renderLegend(); renderLayersPop(); MAP.update(); break;
    case "base": if(tilesBlocked && v!=="none"){ toast("Indisponible dans cet aperçu"); break; } chooseBase(v); break;
    case "home": closePanel(); S.cluster=null; renderCluster(); MAP.home(); break;
    case "theme": S.dark=!S.dark; try{ localStorage.setItem("carte-theme",S.dark?"dark":"light"); }catch(e){} applyTheme(); break;
    case "tour": startTour(); break;
    case "tpause": S.tour.paused=!S.tour.paused; renderTour(); break;
    case "tstop": stopTour(); break;
    case "mlist": document.getElementById("mlist").hidden=false; break;
    case "mmap": document.getElementById("mlist").hidden=true; setTimeout(()=>MAP.map?.invalidateSize(),30); break;
    case "about": openAbout(); break;
    case "about-close": document.getElementById("dabout").close(); break;
    case "about-tour": document.getElementById("dabout").close(); startTour(); break;
  }
});
document.addEventListener("input", e=>{ const f=e.target.dataset?.f; if(f==="q"){ F={...F,q:e.target.value}; clearTimeout(document._q); document._q=setTimeout(renderAll,120); } });
document.addEventListener("change", e=>{ const f=e.target.dataset?.f; if(f && f!=="q") setF({[f]:e.target.value}); });
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape" || document.querySelector("dialog[open]")) return;
  const pop=document.getElementById("layersPop");
  if(!pop.hidden){ pop.hidden=true; return; }
  if(S.tour) stopTour(); else if(S.cluster){ S.cluster=null; renderCluster(); } else if(S.sel) closePanel();
});
document.getElementById("map").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const c=e.target.closest?.(".pcl"); if(c) c.click(); } });
document.getElementById("dmore").addEventListener("click", e=>{ if(e.target.id==="dmore") e.target.close(); });
document.getElementById("dmore").addEventListener("close", ()=>renderAll());
let dragY=null;
panel.addEventListener("pointerdown", e=>{ if(e.target.closest(".grip")) dragY=e.clientY; });
panel.addEventListener("pointerup", e=>{ if(dragY==null) return; const dy=e.clientY-dragY; dragY=null; if(dy<-30){ S.full=true; panel.classList.add("full"); } else if(dy>30){ if(S.full){ S.full=false; panel.classList.remove("full"); } else closePanel(); } });

/* ---------- Capacités de la plateforme Claude (photos partagées, avis, export) ---------- */
const CAP = {db:null, assets:null, dl:null, user:null};
let UID=null; const VOTES=new Map(); let MY={}; let voting=false; let busy=false;
const PHOTOS=new Map(); const AID=/^[0-9a-f]{32}$/;
async function castVote(pid,v){
  if(voting||!CAP.db||!UID) return; voting=true;
  const k=String(pid), next={...MY}; if(next[k]===v) delete next[k]; else next[k]=v;
  try{ await CAP.db.doc("avis/"+UID).set({votes:next,ts:Date.now()}); MY=next; }catch(e){ toast("Votre avis n'a pas pu être enregistré."); }
  voting=false; if(S.sel===pid) renderPanel();
}
async function uploadPhotos(p,files){
  if(busy||!files.length) return; busy=true;
  const msg=(t,err)=>{ const m=document.getElementById("umsg"); if(m){ m.textContent=t; m.classList.toggle("err",!!err); } };
  const credit=(document.getElementById("ucred")?.value||"").trim().slice(0,80); let ok=0;
  for(const [k,file] of files.entries()){
    msg(`Envoi de la photo ${k+1} sur ${files.length}…`);
    if(file.size>20*1024*1024){ msg(`« ${file.name} » dépasse 20 Mo.`,true); continue; }
    try{ const r=await CAP.assets.upload(file); await CAP.db.collection("photos").add({pid:p.id,aid:r.id,cap:file.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").slice(0,90),credit,ts:Date.now()}); ok++; }
    catch(e){ const c=e&&e.code; msg(c==="unsupported_type"?"Format refusé : utilisez JPEG, PNG ou WebP.":c==="quota_or_state"?"L'espace de stockage est plein.":"L'envoi a échoué. Réessayez dans un instant.",true); }
  }
  busy=false; if(ok) toast(ok>1?`${ok} photos ajoutées`:"Photo ajoutée");
}
const refreshPanel = ()=>{ if(S.sel && !panel.hidden) renderPanel(); };
(async ()=>{
  const C = window.claude;
  if(!C || typeof C.use!=="function"){
    // Version hébergée : photos déclarées dans photos/photos.json
    try{ const r=await fetch("photos/photos.json",{cache:"no-cache"}); if(r.ok){ const j=await r.json();
      Object.entries(j||{}).forEach(([pid,arr])=>{ if(!Array.isArray(arr)) return; const ok=arr.filter(x=>x&&typeof x.src==="string"&&/^photos\/[\w.\-\/]+\.(jpe?g|png|webp)$/i.test(x.src)).map(x=>({src:x.src,cap:String(x.legende||x.cap||""),credit:String(x.credit||"")})); if(ok.length) PHOTOS.set(+pid,ok); });
      refreshPanel(); } }catch(e){}
    return;
  }
  try{ CAP.dl = await C.use("downloads"); }catch(e){}
  try{ CAP.user = await C.use("user"); UID = CAP.user ? await CAP.user.id() : null; }catch(e){}
  try{ CAP.db = await C.use("db"); }catch(e){}
  if(CAP.db){
    try{ CAP.db.collection("photos").onSnapshot(snap=>{ PHOTOS.clear(); snap.docs.forEach(d=>{ const x=d.data(); if(!x||!AID.test(x.aid)||typeof x.pid!=="number") return; const a=PHOTOS.get(x.pid)||[]; a.push({src:"/_blob/"+x.aid,cap:String(x.cap||""),credit:String(x.credit||""),ts:+x.ts||0}); PHOTOS.set(x.pid,a); }); PHOTOS.forEach(a=>a.sort((u,v)=>u.ts-v.ts)); refreshPanel(); },()=>{}); }catch(e){}
    try{ CAP.db.collection("avis").onSnapshot(snap=>{ VOTES.clear(); snap.docs.forEach(d=>{ const v=(d.data()||{}).votes; if(!v||typeof v!=="object") return; if(d.id===UID) MY={...v}; Object.entries(v).forEach(([pid,val])=>{ if(!["ok","pb","nv"].includes(val)) return; const c=VOTES.get(pid)||{ok:0,pb:0,nv:0}; c[val]++; VOTES.set(pid,c); }); }); refreshPanel(); },()=>{}); }catch(e){}
  }
  try{ CAP.assets = await C.use("assets"); }catch(e){}
  refreshPanel();
})();

/* ---------- Démarrage ---------- */
try{ const b=localStorage.getItem("carte-fond"); if(b && BASES.some(x=>x.id===b)) S.base=b; }catch(e){}
try{ const t=localStorage.getItem("carte-theme"); const dt=document.documentElement.dataset.theme; S.dark = t ? t==="dark" : dt ? dt==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){}
paintIcons(); applyTheme(); renderLegend(); renderLayersPop();
MAP.init();
renderAll();
readLink();
</script>
